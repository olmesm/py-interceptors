[project]
name = "py-interceptors"
version = "0.2.0"
description = "Composable typed interceptor workflows for Python"
readme = "README.md"
authors = [
    { name = "Oliver Smit", email = "16165237+olmesm@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = ["."]
testpaths = [
    "src",
    "tests",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = ""
commit_message = "chore(release): {version}"
tag_format = "v{version}"
major_on_zero = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"
exclude_commit_patterns = ["^(ci|style|chore|test|build)(\\(.*\\))?:"]

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs", "style",
    "test", "build", "ci", "chore", "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

